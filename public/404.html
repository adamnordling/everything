<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="The requested page could not be found. Return to Everything developer suite homepage."
        />
        <meta name="theme-color" content="#0c0f17" />
        <title>404 — Page Not Found | Everything</title>
        <link rel="icon" type="image/x-icon" href="/favicons/favicon.ico" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

        <style>
            :root {
                --bg: #0c0f17;
                --card: #161a26;
                --text: #f9fafb;
                --muted: #94a3b8;
                --accent: #818cf8;
                --border: rgba(255, 255, 255, 0.12);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: var(--bg);
                color: var(--text);
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                text-align: center;
                padding: 24px;
                line-height: 1.6;
            }

            .error-card {
                background-color: var(--card);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 40px 28px;
                max-width: 460px;
                width: 100%;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            }

            .error-code {
                font-size: 4.5rem;
                font-weight: 800;
                color: var(--accent);
                font-family: ui-monospace, monospace;
                line-height: 1;
                margin-bottom: 12px;
            }

            h1 {
                font-size: 1.35rem;
                font-weight: 700;
                margin-bottom: 8px;
            }

            p {
                color: var(--muted);
                font-size: 0.88rem;
                margin-bottom: 24px;
            }

            .search-form {
                display: flex;
                gap: 8px;
                margin-bottom: 24px;
            }

            .search-input {
                flex: 1;
                background: #0c0f17;
                border: 1px solid var(--border);
                color: var(--text);
                padding: 10px 14px;
                border-radius: 6px;
                font-size: 0.88rem;
                outline: none;
            }

            .search-input:focus {
                border-color: var(--accent);
            }

            .search-btn {
                background: var(--card);
                border: 1px solid var(--border);
                color: var(--text);
                padding: 10px 16px;
                border-radius: 6px;
                font-weight: 600;
                font-size: 0.85rem;
                cursor: pointer;
            }

            .search-btn:hover {
                background: rgba(255, 255, 255, 0.08);
            }

            .home-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                background-color: var(--accent);
                color: #ffffff;
                font-weight: 700;
                font-size: 0.88rem;
                text-decoration: none;
                padding: 10px 24px;
                border-radius: 6px;
                transition: opacity 0.2s;
            }

            .home-btn:hover {
                opacity: 0.9;
            }

            @media print {
                .search-form, .home-btn {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <main class="error-card" aria-labelledby="error-heading">
            <div class="error-code" aria-hidden="true">404</div>
            <h1 id="error-heading">Page Not Found</h1>
            <p>The requested utility tool or route does not exist.</p>

            <form
                action="https://github.com/adamnordling/everything"
                method="get"
                target="_blank"
                class="search-form"
                role="search"
            >
                <input
                    type="search"
                    name="q"
                    class="search-input"
                    placeholder="Search tools or repository..."
                    aria-label="Search tools or repository"
                />
                <button type="submit" class="search-btn">Search</button>
            </form>

            <nav aria-label="Error recovery navigation">
                <a href="/" rel="home" class="home-btn">Return to Everything Suite</a>
            </nav>
        </main>
    </body>
</html>
